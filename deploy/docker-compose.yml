version: '3.5'

services:
  zmed_viewer:
    build:
      context: ./../
      dockerfile: ./deploy/dockerfile
      args:
        - ZVIEWER_HOST=${ZVIEWER_HOST}
        - ZVIEWER_APP_CONFIG=${ZVIEWER_APP_CONFIG}
    image: zmed_webapp:latest
    container_name: zmed_webapp
    volumes:
      - ./config/${ZVIEWER_HOST}.nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./logs/nginx:/var/logs/nginx
      - ./certs:/etc/letsencrypt
      - ./certs:/var/www/letsencrypt
    depends_on:
      - zmed_keycloak
    restart: on-failure
    networks:
      - default

  zmed_keycloak:
    image: adorsys/keycloak:6.0.1
    hostname: zmed_keycloak
    container_name: zmed_keycloak
    volumes:
      - ./volumes/keycloak-themes/ohif:/opt/jboss/keycloak/themes/ohif
      - ./config/${ZVIEWER_KEYCLOAK_CONFIG}:/tmp/ohif-keycloak-realm.json
      - ./certs/${ZVIEWER_HOST}/${ZVIEWER_HOST}.crt:/etc/x509/https/tls.crt
      - ./certs/${ZVIEWER_HOST}/${ZVIEWER_HOST}.key:/etc/x509/https/tls.key
    environment:
      DB_VENDOR: postgres
      DB_ADDR: zmed_postgres
      DB_PORT: 5432
      DB_DATABASE: keycloak
      DB_SCHEMA: public
      DB_USER: keycloak
      DB_PASSWORD: password
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: secret-password
      KEYCLOAK_IMPORT: /tmp/ohif-keycloak-realm.json -Dkeycloak.profile.feature.upload_scripts=enabled
      KC_HOSTNAME_URL: https://${ZVIEWER_HOST}/auth
      PROXY_ADDRESS_FORWARDING: 'true'
    ports:
      - "18443:8443"
      - "18080:8080"
      - "19990:9990"
    depends_on:
      - zmed_postgres
    restart: unless-stopped
    networks:
      - default

  zmed_postgres:
    image: postgres:11.2
    hostname: zmed_postgres
    container_name: zmed_postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    restart: unless-stopped
    networks:
      - default

volumes:
  postgres_data:
    driver: local

networks:
  default:
    driver: bridge
